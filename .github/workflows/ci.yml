# CI (REQUIREMENTS §15.1 TEST-3).
#
# The parity test is the gate: `ml/features.py` and `app/src/ml/features.ts`
# are two implementations of one spec, and when they drift the app produces
# confidently wrong predictions with nothing crashing. It runs as its own job
# so a failure is unmistakable in the checks list, and it blocks merge.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parity:
    name: Parity test (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # Fails loudly if model.json or the fixtures were not regenerated
      # alongside a change to either feature implementation.
      - run: npm run test:parity
        working-directory: app

  app:
    name: App — typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm test
        working-directory: app

  ml:
    name: ML pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: ml
      - run: python -m pytest tests/ -q
        working-directory: ml
      # A short deterministic run: proves the simulator still produces a panel
      # and that SIM-8 holds, without spending CI time on all 200 patients.
      - name: Simulator smoke test
        working-directory: ml
        run: |
          python simulate.py --seed 1 --patients 10 --offline --quiet
          md5sum data/synthetic_panel.csv > /tmp/first.md5
          python simulate.py --seed 1 --patients 10 --offline --quiet
          md5sum data/synthetic_panel.csv > /tmp/second.md5
          diff <(cut -d' ' -f1 /tmp/first.md5) <(cut -d' ' -f1 /tmp/second.md5) \
            && echo "SIM-8: deterministic"
