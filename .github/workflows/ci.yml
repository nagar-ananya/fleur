# Runs the app checks and the simulator on every push to main.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm test
        working-directory: app

  simulator:
    name: Simulator (test data only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: ml
      # Run it twice with the same seed and make sure the output is the same.
      - name: Simulator smoke test
        working-directory: ml
        run: |
          python simulate.py --seed 1 --patients 10 --offline --quiet
          md5sum data/synthetic_panel.csv > /tmp/first.md5
          python simulate.py --seed 1 --patients 10 --offline --quiet
          md5sum data/synthetic_panel.csv > /tmp/second.md5
          diff <(cut -d' ' -f1 /tmp/first.md5) <(cut -d' ' -f1 /tmp/second.md5) \
            && echo "deterministic"
