# CI.
#
# The old blocking parity job is gone: the scoring engine is now written once,
# in TypeScript, so there are no longer two implementations of one spec that can
# drift apart. What replaces it is the rulebook-integrity test inside `npm test`.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App — typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm test
        working-directory: app

  simulator:
    name: Simulator (test data only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: ml
      # The simulator is no longer part of the product — it generates the
      # held-out test data the rulebook's numbers were measured on. This proves
      # it still runs and that SIM-8 determinism holds.
      - name: Simulator smoke test
        working-directory: ml
        run: |
          python simulate.py --seed 1 --patients 10 --offline --quiet
          md5sum data/synthetic_panel.csv > /tmp/first.md5
          python simulate.py --seed 1 --patients 10 --offline --quiet
          md5sum data/synthetic_panel.csv > /tmp/second.md5
          diff <(cut -d' ' -f1 /tmp/first.md5) <(cut -d' ' -f1 /tmp/second.md5) \
            && echo "SIM-8: deterministic"
